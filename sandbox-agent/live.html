<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Chrome 라이브 화면</title>
<style>
  body{margin:0;background:#111;color:#eee;font:14px system-ui,sans-serif}
  #bar{padding:6px 8px;background:#222;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #bar input{flex:1;min-width:140px;padding:8px;border-radius:6px;border:1px solid #555;background:#000;color:#fff;font-size:16px}
  button{padding:8px 10px;border-radius:6px;border:0;background:#3b6ef5;color:#fff;font-size:14px}
  button.s{background:#444}
  #tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 8px 0;background:#181818;white-space:nowrap}
  #tabs button{background:#333;max-width:140px;overflow:hidden;text-overflow:ellipsis;border-radius:6px 6px 0 0}
  #tabs button.on{background:#3b6ef5}
  #tabs button.x{background:#7a2b2b}
  #urlbar{display:flex;gap:6px;padding:6px 8px;background:#222}
  #urlbar input{flex:1;min-width:0;padding:8px;border-radius:6px;border:1px solid #555;background:#000;color:#fff;font-size:16px}
  #wrap{padding:4px}
  canvas{width:100%;height:auto;background:#000;touch-action:manipulation;display:block}
  #msg{padding:4px 8px;color:#fc6;min-height:18px}
</style>
</head>
<body>
<div id="tabs"></div>
<div id="urlbar">
  <input id="url" placeholder="주소 입력 (예: naver.com)" autocapitalize="off" autocomplete="off" inputmode="url">
  <button id="go">이동</button>
</div>
<div id="bar">
  <input id="txt" placeholder="여기에 치거나 붙여넣기 (비밀번호도 바로 들어감)" autocomplete="off" autocapitalize="off">
  <button id="send">입력</button>
  <button class="s" data-k="Enter">Enter</button>
  <button class="s" data-k="Tab">Tab</button>
  <button class="s" data-k="Backspace">⌫</button>
  <button class="s" id="up">▲</button>
  <button class="s" id="dn">▼</button>
</div>
<div id="msg">화면의 로그인 칸을 탭하면 키패드가 뜹니다. 치는 글자가 바로 입력됩니다(붙여넣기도 됨).</div>
<div id="wrap"><canvas id="c" width="1100" height="720"></canvas></div>
<script>
const q = new URLSearchParams(location.search);
const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?token=' + encodeURIComponent(q.get('token') || ''));
ws.binaryType = 'blob';
const c = document.getElementById('c'), g = c.getContext('2d'), msg = document.getElementById('msg');
ws.onmessage = async (e) => {
  if (typeof e.data === 'string') {
    try {
      const j = JSON.parse(e.data);
      if (j.tabs) renderTabs(j.tabs);
      if (j.error) msg.textContent = j.error;
    } catch {}
    return;
  }
  const bmp = await createImageBitmap(e.data);
  if (c.width !== bmp.width || c.height !== bmp.height) { c.width = bmp.width; c.height = bmp.height; }
  g.drawImage(bmp, 0, 0);
};
ws.onclose = () => { msg.textContent = '연결이 끊겼습니다. 새로고침하세요.'; };
const send = (o) => ws.readyState === 1 && ws.send(JSON.stringify(o));
// ---- tabs: tap a tab to switch, + opens a new one, x closes the current one ----
const tabsEl = document.getElementById('tabs');
function renderTabs(list) {
  tabsEl.textContent = '';
  list.forEach((t) => {
    const b = document.createElement('button');
    b.textContent = t.n + '. ' + (t.title || t.url || '새 탭');
    if (t.active) b.className = 'on';
    b.onclick = () => { send({ t: 'tab', n: t.n }); };
    tabsEl.appendChild(b);
  });
  const add = document.createElement('button');
  add.textContent = '+';
  add.onclick = () => send({ t: 'newtab' });
  tabsEl.appendChild(add);
  if (list.length > 1) {
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '현재 탭 닫기';
    x.onclick = () => send({ t: 'closetab' });
    tabsEl.appendChild(x);
  }
}
ws.addEventListener('open', () => { send({ t: 'tabs' }); setInterval(() => send({ t: 'tabs' }), 2500); });
const go = () => {
  const u = document.getElementById('url');
  let v = u.value.trim();
  if (!v) return;
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  send({ t: 'goto', u: v });
  u.value = '';
};
document.getElementById('go').onclick = go;
document.getElementById('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } });

const txt = document.getElementById('txt');
c.addEventListener('click', (e) => {
  const r = c.getBoundingClientRect();
  send({ t: 'click', x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height });
  txt.focus({ preventScroll: true }); // phone keyboard pops up right after tapping a field on the screen
});
// Whatever is typed or pasted goes straight to Chrome (works for passwords too), then the box is cleared.
// The box always holds one invisible marker character, so the phone keyboard's delete key has something
// to delete: when the marker disappears we know Backspace was pressed (and send it to Chrome).
const MARK = '​';
const reset = () => { txt.value = MARK; };
const flush = () => {
  const v = txt.value.split(MARK).join('');
  if (v) send({ t: 'text', v });
  reset();
};
reset();
txt.addEventListener('focus', () => { if (!txt.value) reset(); });
txt.addEventListener('input', (e) => {
  if (e.isComposing) return; // wait for Korean/IME composition to finish
  if (!txt.value.includes(MARK)) { send({ t: 'key', k: 'Backspace' }); reset(); return; }
  flush();
});
txt.addEventListener('compositionend', flush);
txt.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); flush(); send({ t: 'key', k: 'Enter' }); } });
document.getElementById('send').onclick = flush;
document.querySelectorAll('button[data-k]').forEach((b) => b.onclick = () => send({ t: 'key', k: b.dataset.k }));
document.getElementById('up').onclick = () => send({ t: 'scroll', dy: -400 });
document.getElementById('dn').onclick = () => send({ t: 'scroll', dy: 400 });
</script>
</body>
</html>
